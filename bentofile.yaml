
service: "service.service:RetinaOpsService"

include:
  - "service/*.py"
  - "models/best.pt"

python:
  lock_packages: false
  extra_index_url:
    - "https://pypi.org/simple"
    - "https://download.pytorch.org/whl/cpu"
  pip_args: "--index-strategy unsafe-best-match"
  packages:
    - torch==2.5.1+cpu
    - ultralytics
    - sahi
    - numpy
    - pillow
