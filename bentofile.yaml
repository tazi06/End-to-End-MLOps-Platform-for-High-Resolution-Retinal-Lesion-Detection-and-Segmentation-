
service: "service.service:RetinaOpsService"

include:
  - "service/*.py"
  - "models/best.pt"

docker:
  system_packages:
    - libgl1
    - libglib2.0-0
    - libxcb1

python:
  lock_packages: false
  packages:
    - "torch @ https://download.pytorch.org/whl/cpu/torch-2.5.1%2Bcpu-cp311-cp311-linux_x86_64.whl"
    - ultralytics
    - sahi
    - numpy
    - pillow
