
name: Deploy RetinaOps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: [self-hosted, linux]

    env:
      KUBECONFIG: /home/devops/.kube/config

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --extra-index-url https://download.pytorch.org/whl/cpu -r requirements.txt

      - name: Download Model from MLflow
        env:
          MLFLOW_TRACKING_URI: ${{ secrets.MLFLOW_TRACKING_URI }}
          MLFLOW_TRACKING_USERNAME: ${{ secrets.MLFLOW_TRACKING_USERNAME }}
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.MLFLOW_TRACKING_PASSWORD }}
        run: |
          python scripts/import_model.py

      - name: Build Bento
        id: bento
        run: |
          RAW_TAG=$(bentoml build --version "${GITHUB_SHA:0:12}" --output tag)
          BENTO_TAG="${RAW_TAG#__tag__:}"
          echo "Bento tag: $BENTO_TAG"
          echo "tag=$BENTO_TAG" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/retinaops-api:${{ github.sha }}
          UV_LINK_MODE: copy
        run: |
          bentoml containerize "${{ steps.bento.outputs.tag }}" --image-tag "$IMAGE" --opt load

      - name: Smoke Test
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/retinaops-api:${{ github.sha }}
        run: |
          docker run -d --name retinaops-smoke -p 3000:3000 "$IMAGE"

          cleanup() {
            status=$?
            if [ "$status" -ne 0 ]; then
              docker logs retinaops-smoke || true
            fi
            docker rm -f retinaops-smoke >/dev/null 2>&1 || true
            exit "$status"
          }
          trap cleanup EXIT

          chmod +x scripts/smoke_test.sh
          ./scripts/smoke_test.sh http://127.0.0.1:3000/healthz

      - name: Push Docker Image
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/retinaops-api:${{ github.sha }}
        run: |
          docker push "$IMAGE"

      - name: Deploy to K3s
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/retinaops-api:${{ github.sha }}
        run: |
          sed "s|IMAGE_PLACEHOLDER|$IMAGE|g" deployment/deployment.yaml | kubectl apply -f -
          kubectl apply -f deployment/k3s/service.yaml
          kubectl rollout status deployment/retinaops-api --timeout=180s

      - name: Deployment Status
        run: |
          kubectl get pods -l app=retinaops-api
          kubectl get deployment retinaops-api
          kubectl get service retinaops-service
